name: Fix Release Flags

# One-off utility to correct a release's prerelease flag after the fact -
# for releases published (or still sitting as a draft) before release.yml's
# `finalize` job started doing this automatically, or if finalize itself
# failed (as it did on app-v0.1.2's first run - see release.yml's finalize
# job comment). Doesn't touch draft status or --latest: GitHub rejects
# make_latest=true on a still-draft release outright, and it isn't needed
# anyway - GitHub resolves /releases/latest to any non-prerelease,
# non-draft release on its own once it's published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to fix (e.g. app-v0.1.1)"
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Force non-prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --prerelease=false
