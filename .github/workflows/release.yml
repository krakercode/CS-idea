name: Release

# Builds native installers for Windows, macOS (Intel + Apple Silicon), and
# Linux, and publishes them as a GitHub Release. If TAURI_SIGNING_PRIVATE_KEY
# is configured (see README's "Releasing & auto-updates" section), the
# updater manifest (latest.json) is generated and signed too, so existing
# installs can auto-update to this release once it's published.
#
# Trigger by pushing a tag like `app-v0.2.0`, or manually via
# Actions -> Release -> Run workflow (fill in the same tag name there).
# Bump the version in src-tauri/tauri.conf.json (and package.json, to keep
# them in sync) before releasing - the updater compares against that version.

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. app-v0.1.0)"
        required: true
        default: "app-v0.1.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: release_tag
        shell: bash
        # A real tag push already names the ref correctly; a manual dispatch
        # run isn't triggered from a tag ref at all, so it takes the tag name
        # from the workflow_dispatch input instead.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: "JESSPR-EAST ${{ steps.release_tag.outputs.tag }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # tauri-action's `prerelease: false` input above hasn't reliably produced a
  # non-prerelease release (both app-v0.1.0 and app-v0.1.1 came out flagged
  # prerelease despite it) - and GitHub's `/releases/latest` endpoint, which
  # the in-app updater's endpoint URL depends on, only ever resolves to a
  # non-prerelease, non-draft release. Left alone, that silently breaks
  # auto-updates: the updater's request 404s and gets treated as "no update
  # available". This job forces the flag straight after the build regardless
  # of what tauri-action did, without touching draft status - the release
  # still needs a human to hit Publish.
  finalize:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Force the release to be a full (non-prerelease) release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.release_tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --prerelease=false \
            --latest
