[package]
name = "jesspr-east"
version = "0.1.5"
description = "Always-on second-monitor dashboard: news, stocks, sports/esports calendar, CS2 nade/pro-play database, Spotify."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sysinfo = "0.38.4"
feed-rs = "2.4.0"
futures = "0.3.33"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
nvml-wrapper = "0.12.1"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-opener = "2.5.4"
rand = "0.10.2"
sha2 = "0.11.0"
base64 = "0.23.0"

[profile.release]
# Keep the always-running background footprint small.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
