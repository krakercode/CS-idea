[package]
name = "cs-idea-dashboard"
version = "0.1.0"
description = "Always-on second-monitor dashboard: news, stocks, sports/esports calendar, CS2 nade/pro-play database, Spotify."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Keep the always-running background footprint small.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
